name: Accessibility work
description: Report or plan an accessibility requirement, defect, or validation gap.
title: "[Accessibility]: "
body:
  - type: textarea
    id: barrier
    attributes:
      label: User barrier and affected workflow
      description: Describe the user need, assistive technology or input method, and impact.
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Current behavior and reproduction
      description: Include controls, focus order, names, states, announcements, visual conditions, scale, and environment.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Governing criteria and milestone
      description: Link the accessibility specification, applicable WCAG criteria, product requirement, issue, and roadmap milestone.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, dependencies, and non-goals
      description: Identify affected components, data or semantic alternatives, blockers, and preserved behavior.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define keyboard, focus, semantics, announcements, contrast, High Contrast, reduced-motion, scaling, and assistive-technology outcomes.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Include automated checks, keyboard-only flow, NVDA, Accessibility Insights, scale, theme, and regression coverage.
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Security, compatibility, and documentation
      description: State related risks and list the guides, QA, specifications, and decision records to update.
    validations:
      required: true
